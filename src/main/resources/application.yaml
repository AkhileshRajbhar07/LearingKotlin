sentry:
  dsn: ${SENTRY_DSN:}
  release: ${SENTRY_RELEASE:local}

rabbitmq:
  host: ${RABBITMQ_HOST:localhost}
  port: ${RABBITMQ_PORT:5676}
  username: carbon-relay
  password: ${RABBITMQ_PASSWORD:carbon-relay}
  virtual-host: carbon-relay
  listener:
    direct:
      acknowledge-mode: manual

external:
  service:
    qualicharge:
      url: ${QUALICHARGE_URL:http://localhost:54583}


kafka:
  topics:
    cp-manually-registered: domain_event.cp_manually_registered
    cp-imported: domain_event.cp_imported
    cp-migrated: domain_event.cp_migrated
    cp-automatically-registered: domain_event.cp_automatically_registered
    cp-address-updated: domain_event.cp_address_updated
    cp-company-updated: domain_event.cp_company_updated
    mandant-created: domain_event.mandant_created
    company-created: domain_event.company_created
    cp-connector-automatically-registered: domain_event.cp_connector_automatically_registered
    cp-connector-imported: domain_event.cp_connector_imported
    cp-connector-manually-registered: cdomain_event.p_connector_manually_registered
    cp-connector-migrated: domain_event.cp_connector_migrated
    evse-id-updated: domain_event.evse_id_updated
  groups:
    cp-manually-registered: domain_event.cp_manually_registered-group
    cp-imported: domain_event.cp_imported_group
    cp-migrated: domain_event.cp_migrated_group
    cp-automatically-registered: domain_event.cp_automatically_registered-group
    cp-address-updated: domain_event.cp_address_updated_group
    cp-company-updated: domain_event.cp_company_updated_group
    mandant-created: domain_event.mandant_created_group
    company-created: domain_event.company_created_group
    cp-connector-automatically-registered: domain_event.cp_connector_automatically_registered_group
    cp-connector-imported: domain_event.cp_connector_imported_group
    cp-connector-manually-registered: domain_event.cp_connector_manually_registered_group
    cp-connector-migrated: domain_event.cp_connector_migrated_group
    evse-id-updated: domain_event.evse_id_updated_group
